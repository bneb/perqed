[workspace]
members = [
    "crates/perqed-audit",
    "crates/perqed-sandbox",
    "crates/perqed-lean-client",
    "crates/perqed-core",
    "crates/perqed-export",
    "crates/perqed-cli",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Perqed Contributors <research@perqed.org>"]
license = "Apache-2.0"
repository = "https://github.com/perqed/perqed"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tempfile = "3.12"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
futures = "0.3"
num-rational = { version = "0.4", features = ["serde"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
